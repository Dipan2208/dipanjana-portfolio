<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    svg:hover .orbit-circle {
      transform-origin: center;
      animation: rotate 8s linear infinite;
    }
  </style>
  <defs>
    <!-- Purple Dominant Gradient -->
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B2EFF"/>  <!-- deep purple -->
      <stop offset="60%" stop-color="#9B5CFF"/> <!-- lighter purple -->
      <stop offset="85%" stop-color="#3DA9FC"/> <!-- subtle blue -->
      <stop offset="100%" stop-color="#FFD166"/> <!-- hint of gold -->
    </linearGradient>
    <!-- Stronger Neon Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Orbit (thin + elegant) -->
  <circle class="orbit-circle" cx="110" cy="110" r="72"
          stroke="url(#purpleGrad)"
          stroke-width="1.8"
          opacity="0.6"
          fill="none"
          filter="url(#glow)"/>
  <!-- Orbit Accent Arc (motion feel) -->
  <path d="M50 110 A60 60 0 0 1 170 110"
        stroke="#9B5CFF"
        stroke-width="1.2"
        stroke-dasharray="8 10"
        opacity="0.5"
        fill="none"/>
  <!-- Orbit Node -->
  <circle cx="182" cy="110" r="4" fill="#9B5CFF" filter="url(#glow)"/>
  <!-- Futuristic DG Monogram -->
  <!-- D -->
  <path d="M 68 68 H 96 L 106 78 V 142 L 96 152 H 68 Z
           M 78 80 H 93 L 98 85 V 135 L 93 140 H 78 Z"
        fill-rule="evenodd"
        fill="url(#purpleGrad)"
        filter="url(#glow)"/>
  <!-- G -->
  <path d="M 152 82 L 138 68 H 124 L 114 78 V 142 L 124 152 H 144 L 152 144 V 110 H 132 V 120 H 142 V 141 L 139 144 H 127 L 124 141 V 79 L 127 76 H 135 L 143 84 L 152 82 Z"
        fill="url(#purpleGrad)"
        filter="url(#glow)"/>
</svg>
